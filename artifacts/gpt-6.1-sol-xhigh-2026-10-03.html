<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>去海边，慢慢骑 · 鹈鹕骑自行车</title>
  <style>
    :root { --paper:#f7f4e9; --ink:#304c45; --muted:#5f6f64; --line:#d8ddcf; --teal:#397e76; --orange:#c76a48; }
    * { box-sizing:border-box; }
    html { background:var(--paper); color:var(--ink); }
    body { margin:0; font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:3px solid var(--orange); outline-offset:5px; }
    ::selection { background:#e8b495; color:var(--ink); }
    .page { max-width:1500px; margin:auto; padding:30px 54px 26px; min-height:100svh; display:flex; flex-direction:column; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand svg { width:39px; height:39px; }
    .brand-name { font-size:17px; font-weight:600; letter-spacing:.14em; }
    .brand-caption { font-size:10px; letter-spacing:.2em; margin-top:5px; }
    .weather { display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.06em; }
    .weather svg { width:19px; height:19px; color:var(--orange); }
    main { display:flex; flex:1; flex-direction:column; justify-content:center; }
    .scene { position:relative; margin:20px -34px 0; }
    .introduction { position:absolute; left:37px; top:37px; z-index:1; pointer-events:none; }
    h1 { font-family:"Songti SC","STSong","Noto Serif CJK SC",serif; font-size:clamp(34px,3.7vw,53px); font-weight:500; line-height:1.35; letter-spacing:.04em; margin:0; }
    .introduction p { font-size:13px; line-height:1.7; letter-spacing:.07em; margin:19px 0 0; color:var(--muted); }
    .art { display:block; width:100%; max-height:min(680px,calc(100svh - 230px)); overflow:visible; }
    .control-strip { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); margin:0 3px; padding-top:22px; gap:24px; }
    .trip-note { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
    .trip-note svg { width:23px; height:23px; }
    .controls { display:flex; align-items:center; gap:24px; }
    .play-button { display:flex; align-items:center; gap:8px; border:0; padding:8px 0; background:transparent; cursor:pointer; font-size:13px; white-space:nowrap; }
    .play-button svg { width:19px; height:19px; }
    .play-icon { display:none; }
    [data-paused="true"] .play-icon { display:block; }
    [data-paused="true"] .pause-icon { display:none; }
    .speed { display:flex; flex-shrink:0; gap:3px; align-items:center; padding:4px; border:1px solid var(--line); border-radius:28px; }
    .speed button { border:0; border-radius:20px; padding:8px 15px; background:transparent; font-size:12px; cursor:pointer; white-space:nowrap; transition:background .18s,color .18s; }
    .speed button[aria-pressed="true"] { color:var(--paper); background:var(--ink); }
    .speed button:hover:not([aria-pressed="true"]) { background:#e8e9dc; }
    .bell-button { width:43px; height:43px; border:1px solid var(--line); background:transparent; border-radius:50%; display:grid; place-items:center; cursor:pointer; transition:background .18s; }
    .bell-button:hover { background:#e8e9dc; }
    .bell-button svg { width:20px; height:20px; }
    footer { display:flex; justify-content:space-between; gap:16px; margin-top:29px; color:var(--muted); font-size:10px; letter-spacing:.13em; }
    .footer-motto { letter-spacing:.06em; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    #bell-words { opacity:0; }
    #bell-words.ringing { animation:ding .9s ease-out forwards; }
    @keyframes ding { 0% { opacity:0; transform:translateY(7px); } 20% { opacity:1; } 75% { opacity:1; } 100% { opacity:0; transform:translateY(-17px); } }
    @media (min-width:1500px) { .page { padding-top:42px; } }
    @media (max-width:760px) {
      .page { padding:24px 24px 22px; }
      .weather span { display:none; }
      .brand-name { font-size:15px; }
      main { justify-content:flex-start; }
      .scene { margin:34px -24px 0; padding-top:119px; }
      .introduction { left:25px; top:0; }
      h1 { font-size:35px; line-height:1.28; }
      h1 br { display:none; }
      .introduction p { font-size:12px; margin-top:14px; }
      .art { height:auto; min-height:310px; max-height:none; }
      .control-strip { flex-direction:column; gap:18px; padding-top:19px; margin-top:8px; }
      .controls { gap:8px; width:100%; justify-content:space-between; }
      .speed button { padding:8px 9px; }
      .trip-note { font-size:11px; }
      footer { margin-top:auto; padding-top:34px; font-size:9px; }
    }
    @media (max-width:359px) {
      .page { padding-left:18px; padding-right:18px; }
      .scene { margin-left:-18px; margin-right:-18px; }
      .introduction { left:19px; }
      h1 { font-size:30px; }
      .controls { gap:7px; }
      .play-button { font-size:12px; }
      .speed button { font-size:11px; padding:8px 6px; }
      .bell-button { width:38px; height:38px; }
    }
    @media (prefers-reduced-motion:reduce) { button { transition:none !important; } #bell-words.ringing { animation:none; } }
  </style>
</head>

          <g fill="none" stroke="#c3c7ac" stroke-width="1.6" stroke-linecap="round" opacity=".85"><path id="wind-lines" d="M327 270h48M314 289h36M304 311h54"/></g>
        </g>
      </svg>
    </figure>
    <div class="control-strip">
      <div class="trip-note"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M2 16q4-4 8 0t8 0t6 0M2 21q4-4 8 0t8 0t6 0"/><path d="M17 11a5 5 0 1 0-9 0M12 1v2M3 5l2 1m14-1-2 1"/></svg><span id="ride-note">沿着海岸线，悠哉悠哉。</span></div>
      <div class="controls">
        <button id="play" class="play-button" type="button" aria-label="暂停骑行" data-paused="false">
          <svg class="pause-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 5v10M13 5v10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          <svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="m6 4 10 6-10 6Z"/></svg>
          <span id="play-label">歇一会儿</span>
        </button>
        <div class="speed" role="group" aria-label="骑行速度">
          <button type="button" data-speed="0.6" aria-pressed="false">慢悠悠</button>
          <button type="button" data-speed="1" aria-pressed="true">刚刚好</button>
          <button type="button" data-speed="1.65" aria-pressed="false">追海风</button>
        </div>
        <button id="bell" class="bell-button" type="button" aria-label="按车铃" title="按车铃"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 14a7 7 0 0 1 14 0v2H5Z M3 16h18M10 20h4M12 5V3m6 3 2-2"/></svg></button>
      </div>
    </div>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
  <footer><span>ENJOY THE LITTLE DETOURS.</span><span class="footer-motto">骑到哪里，哪里就是好风景。</span></footer>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const scene = $('scene');
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const mobile = window.matchMedia('(max-width: 760px)');
  let paused = motionPreference.matches;
  let speed = 1;
  let time = 0;
  let last = 0;
  let frame = null;
  let bellTimer;
  let audio;
  const spokes = [$('rear-spokes'), $('front-spokes')];
  const notes = { '0.6':'慢一点，也会到海边。', '1':'沿着海岸线，悠哉悠哉。', '1.65':'迎着海风，再快一点点。' };
  const parts = ['far-leg','far-foot','near-leg','leg-highlight','near-foot','far-pedal','near-pedal','crank','bicycle-rider','scarf-tail-back','scarf-tail-front','scarf-line','road-marks','far-birds','sea-waves','foreground'].reduce((result,id) => { result[id] = $(id); return result; }, {});
  // Two-link inverse kinematics keep both feet attached to opposing pedals.
  function leg(hipX, hipY, footX, footY, side) {
    const dx = footX - hipX, dy = footY - hipY;
    const distance = Math.hypot(dx,dy);
    const upper = 84, lower = 94;
    const along = (upper*upper-lower*lower+distance*distance)/(2*distance);
    const bend = Math.sqrt(Math.max(0, upper*upper-along*along));
    const kneeX = hipX + along*dx/distance + side*bend*dy/distance;
    const kneeY = hipY + along*dy/distance - side*bend*dx/distance;
    return `M${hipX} ${hipY} Q${kneeX.toFixed(2)} ${kneeY.toFixed(2)} ${footX.toFixed(2)} ${footY.toFixed(2)}`;
  }
  function draw() {
    const phase = time * Math.PI * 2 / 2.7;
    const x = 546 + Math.cos(phase)*28;
    const y = 479 + Math.sin(phase)*28;
    const fx = 1092-x, fy = 958-y;
    const turn = phase*180/Math.PI;
    const bounce = Math.sin(phase*2)*1.2;
    for (const wheel of spokes) wheel.setAttribute('transform',`rotate(${turn*1.15})`);
    parts.crank.setAttribute('transform',`rotate(${turn} 546 479)`);
    parts['near-leg'].setAttribute('d',leg(510,350,x,y,1));
    parts['leg-highlight'].setAttribute('d',leg(511,351,x,y,1));
    parts['far-leg'].setAttribute('d',leg(498,353,fx,fy,-1));
    parts['near-foot'].setAttribute('transform',`translate(${x} ${y})`);
    parts['far-foot'].setAttribute('transform',`translate(${fx} ${fy})`);
    parts['near-pedal'].setAttribute('transform',`translate(${x} ${y})`);
    parts['far-pedal'].setAttribute('transform',`translate(${fx} ${fy})`);
    parts['bicycle-rider'].setAttribute('transform',`translate(0 ${bounce})`);
    const flutter = Math.sin(phase*1.5)*6;
    parts['scarf-tail-back'].setAttribute('d',`M558 246Q503 ${235+flutter} 483 ${220+flutter}T435 ${231-flutter/2}l6 15Q467 ${233-flutter/2} 483 ${244+flutter}T552 264Z`);
    parts['scarf-tail-front'].setAttribute('d',`M563 243Q524 ${250-flutter} 498 ${238-flutter}T449 ${248+flutter/2}l9 14Q482 ${252+flutter/2} 500 ${263-flutter}T563 258Z`);
    parts['scarf-line'].setAttribute('d',`M553 253Q522 ${258-flutter} 499 ${248-flutter}T458 ${255+flutter/2}`);
    parts['road-marks'].setAttribute('transform',`translate(${-time*95%140} 0)`);
    parts['far-birds'].setAttribute('transform',`translate(${Math.sin(time*.22)*13} ${Math.sin(time*.5)*3})`);
    parts['sea-waves'].setAttribute('transform',`translate(${Math.sin(time*.4)*5} 0)`);
    parts.foreground.setAttribute('transform',`translate(${Math.sin(phase*.55)*1.5} 0)`);
  }
  function animate(timestamp) {
    if (paused || document.hidden) { frame = null; return; }
    if (last) time += Math.min((timestamp-last)/1000,.05)*speed;
    last = timestamp;
    draw();
    frame = requestAnimationFrame(animate);
  }
  function syncPlayback() {
    $('play').dataset.paused = String(paused);
    $('play').setAttribute('aria-label',paused ? '继续骑行' : '暂停骑行');
    $('play-label').textContent = paused ? '继续出发' : '歇一会儿';
    $('ride-note').textContent = paused ? '停一停，听听海的声音。' : notes[String(speed)];
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null; last = 0;
    if (!paused && !document.hidden) frame = requestAnimationFrame(animate);
  }
  $('play').addEventListener('click',() => { paused = !paused; syncPlayback(); });
  document.querySelectorAll('[data-speed]').forEach(button => button.addEventListener('click',() => {
    speed = Number(button.dataset.speed);
    document.querySelectorAll('[data-speed]').forEach(option => option.setAttribute('aria-pressed',String(option === button)));
    $('ride-note').textContent = paused ? '停一停，听听海的声音。' : notes[String(speed)];
  }));
  $('bell').addEventListener('click',() => {
    $('announcement').textContent = '叮铃，海边的朋友，下午好！';
    $('bell-words').classList.remove('ringing');
    void $('bell-words').getBoundingClientRect();
    $('bell-words').classList.add('ringing');
    if (motionPreference.matches) $('bell-words').style.opacity = '1';
    clearTimeout(bellTimer);
    bellTimer = setTimeout(() => { $('bell-words').classList.remove('ringing'); $('bell-words').style.opacity = ''; $('announcement').textContent = ''; },1100);
    // Sound is created locally, only after the visitor presses the bell.
    try {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (!Audio) return;
      audio ||= new Audio();
      audio.resume();
      [0,.15].forEach(delay => {
        [1244,2488].forEach((frequency,index) => {
          const oscillator = audio.createOscillator(), gain = audio.createGain();
          const start = audio.currentTime+delay;
          oscillator.type = 'sine'; oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0,start);
          gain.gain.linearRampToValueAtTime(index ? .025 : .09,start+.008);
          gain.gain.exponentialRampToValueAtTime(.0001,start+.75);
          oscillator.connect(gain); gain.connect(audio.destination);
          oscillator.start(start); oscillator.stop(start+.8);
        });
      });
    } catch { /* The visible bell feedback also works when audio is unavailable. */ }
  });
  function fitScene() { scene.setAttribute('viewBox',mobile.matches ? '245 125 645 525' : '0 0 1200 650'); }
  mobile.addEventListener('change',fitScene);
  motionPreference.addEventListener('change',event => { paused = event.matches; syncPlayback(); });
  document.addEventListener('visibilitychange',syncPlayback);
  fitScene(); draw(); syncPlayback();
})();
</script>
</body>
</html>
