<style>

<body><main>
<header><span>THE SLOW DAYS CLUB / 慢悠悠俱乐部</span><span class="stamp" aria-hidden="true">✳</span></header>
<h1>鹈鹕的兜风日</h1><p class="intro">风刚刚好，去海边转一圈。</p>

<footer><span class="caption">A little breeze. A little ride. A lovely day.</span><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">骑行速度</label><input id="speed" type="range" min="0.4" max="2" step="0.1" value="1" aria-label="骑行速度"></div></footer>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,phase=.5,last=0;const button=$('toggle'),speed=$('speed');function updateButton(){button.textContent=running?'暂停骑行':'继续骑行';button.setAttribute('aria-pressed',String(!running))}button.addEventListener('click',()=>{running=!running;updateButton()});updateButton();
function draw(t){const angle=t*180/Math.PI;['backWheel','frontWheel'].forEach(id=>$(id).setAttribute('transform',`rotate(${angle})`));const bob=Math.sin(t*2)*2;$('bird').setAttribute('transform',`translate(0 ${bob})`);const x=477+Math.cos(t)*30,y=422+Math.sin(t)*30,fx=954-x,fy=844-y;$('crank').setAttribute('d',`M${fx} ${fy}L${x} ${y}`);
$('nearLeg').setAttribute('d',`M467 ${296+bob} Q${444+Math.cos(t)*12} 350 ${x} ${y-7}`);$('farLeg').setAttribute('d',`M443 ${294+bob} Q${492-Math.cos(t)*12} 350 ${fx} ${fy-7}`);
function foot(id,px,py){$(id).setAttribute('d',`M${px-8} ${py-9}Q${px+4} ${py-8} ${px+21} ${py+2}L${px-14} ${py+2}Z`)}foot('farFoot',fx,fy);foot('nearFoot',x,y);$('scarf').setAttribute('transform',`rotate(${Math.sin(t*2)*5} 483 188)`);$('clouds').setAttribute('transform',`translate(${Math.sin(t*.14)*15} 0)`);$('road').setAttribute('transform',`translate(${-((t*36)%100)} 0)`)}
function frame(now){if(last&&running)phase+=Math.min((now-last)/1000,.05)*3*Number(speed.value);last=now;draw(phase);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
