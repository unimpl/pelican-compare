<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ea;color:#283e3a;font-family:ui-sans-serif,system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1100px;margin:auto;padding:38px 34px 26px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d6dbce;padding-bottom:20px}.brand{font-size:13px;letter-spacing:3px}.edition{font-size:12px;color:#737e70}h1{font-size:clamp(28px,4vw,46px);font-weight:500;letter-spacing:-1px;margin:30px 0 6px}p{font-size:14px;color:#778271;margin:0}.scene{display:block;width:100%;height:auto;overflow:hidden}footer{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:20px;border-top:1px solid #d6dbce}.controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap}button{background:#2c5348;color:#fff9e9;border:0;border-radius:30px;padding:12px 23px;font:inherit;font-size:13px;cursor:pointer;min-width:94px}button:hover{background:#386656}button:focus-visible,input:focus-visible{outline:3px solid #dc9350;outline-offset:4px}label{font-size:12px;display:flex;align-items:center;gap:12px}input{width:100px;accent-color:#426d5c}.note{font-size:11px;letter-spacing:2px;color:#7c8677}svg .ink{stroke:#304d46;stroke-linecap:round;stroke-linejoin:round} @media(max-width:550px){main{padding:22px 18px}.edition{display:none}h1{margin-top:24px}footer{align-items:flex-start}.note{display:none}.scene{margin:18px 0}label{gap:8px}.controls{gap:14px}}
</style>
</head>
<body><main>
<header><span class="brand">PELICAN CYCLING CLUB</span><span class="edition">海岸漫游 · No. 001</span></header>
<h1>风刚好，慢慢骑。</h1><p>一只鹈鹕，一辆单车，一段不赶时间的海岸线。</p>
<svg class="scene" viewBox="0 0 1000 590" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">鹈鹕骑自行车</title><desc id="scene-desc">戴着绿色小帽、围着橙色围巾的白色鹈鹕，在海边踩着绿色自行车。双腿带动车踏板，车轮持续转动，远处是太阳、海浪和帆船。</desc>
<defs>
<pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L10 10" stroke="#b3b7a3" stroke-width="1"/></pattern>
<g id="wheel"><circle r="90" fill="#f6f3ea" stroke="#304d46" stroke-width="9"/><circle r="80" fill="none" stroke="#c2c5b2" stroke-width="2"/><g class="spokes" stroke="#a2b5a5" stroke-width="1.6"><path d="M-79 0H79M0-79V79M-56-56L56 56M-56 56L56-56M-73-30L73 30M-30-73L30 73M-73 30L73-30M-30 73L30-73"/><circle cy="-79" r="4" fill="#d0a256" stroke="none"/></g><circle r="8" fill="#e1be78" stroke="#304d46" stroke-width="3"/></g>
</defs>
<!-- Coastal landscape -->
<circle cx="780" cy="135" r="53" fill="#f0d590"/>
<g fill="none" stroke="#d5dccd" stroke-width="2"><path d="M90 259H345M644 259H944M701 270H883M120 277H237"/><path d="M734 225q13-11 26 0q13-11 26 0M119 143q11-12 22 0q11-12 22 0"/></g>
<g fill="#e6e9dc"><path d="M0 338Q163 278 305 319T609 315T1000 320V418H0Z"/><path d="M0 376Q173 339 336 367T679 357T1000 360V433H0Z" fill="#d8e1ce"/></g>
<g id="boat" transform="translate(845 265)"><path d="M-22 0H26L16 10H-12Z" fill="#a1b8a3"/><path d="M2-53V-5H-23Z" fill="#fffdf2"/><path d="M7-39V-5H26Z" fill="#d2d9c7"/></g>
<path d="M0 442Q218 429 493 442T1000 441V590H0Z" fill="#ece7d8"/>
<path d="M0 466H1000" stroke="#d8d4c3" stroke-width="2"/>
<g id="road" stroke="#c5c6b2" stroke-width="3" stroke-linecap="round"><path d="M-200 517h60M10 536h90M240 517h60M450 536h90M680 517h60M890 536h90M1120 517h60"/></g>
<g fill="#9ead8b"><path d="M80 443q-15-29-22-25q8 24 22 25M80 443q6-33 18-37q-1 27-18 37M916 443q-8-27-19-30q1 21 19 30M916 443q10-22 20-21q-4 18-20 21"/></g>
<ellipse cx="495" cy="483" rx="244" ry="13" fill="#acb09b" opacity=".17"/>
<!-- Cycle -->
<g id="cycle" class="ink">
<g transform="translate(325 390)"><use href="#wheel"/><g id="rear-spin"></g></g>
<g transform="translate(669 390)"><use href="#wheel"/></g>
<path d="M260 342A99 99 0 0 1 408 339M594 327A99 99 0 0 1 741 326" fill="none" stroke="#78917b" stroke-width="5"/>
<path d="M327 388L463 378L438 403L329 404Q311 398 327 388" fill="none" stroke="#637465" stroke-width="3"/>
<g id="far-leg" stroke="#c28a4e" stroke-width="13" fill="none"><path id="far-shin" d="M447 286L480 325L450 379"/><path id="far-foot" d="M442 379h27" stroke-width="10"/></g>
<path d="M325 390L405 271L462 390ZM405 271H623L462 390M623 271L669 390" fill="none" stroke="#304d46" stroke-width="12"/>
<path d="M325 390L405 271L462 390ZM405 271H623L462 390M623 271L669 390" fill="none" stroke="#70957a" stroke-width="7"/>
<path d="M405 271L395 247M623 271L609 230L627 215H655" fill="none" stroke="#304d46" stroke-width="7"/>
<path d="M653 215h20" stroke="#bd8857" stroke-width="10"/>
<path d="M375 245Q375 235 390 235H423Q435 236 434 244Q408 251 375 245Z" fill="#805e47" stroke-width="3"/>
<circle cx="462" cy="390" r="22" fill="#e2dfcc" stroke-width="4"/><circle cx="462" cy="390" r="14" fill="#9caf96" stroke-width="2"/>
<g id="crank" stroke-width="5"><path d="M-29 0H29"/><circle r="4" fill="#d2b574"/></g>
<!-- Pelican silhouette -->
<g id="bird">
<path d="M387 232Q346 215 333 180Q367 188 390 200L361 173Q401 179 418 201" fill="#fdfaf0" stroke-width="3"/>
<path d="M390 197Q415 175 468 198Q511 214 526 186Q535 169 523 137Q505 93 541 72Q568 56 591 79Q609 97 596 122Q586 140 566 149Q585 202 553 244Q534 282 478 284Q414 280 390 251Q373 229 390 197Z" fill="#fdfbf2" stroke-width="3.5"/>

<path d="M603 129Q644 153 707 143" fill="none" stroke="#d79e55" stroke-width="2"/>
<circle cx="571" cy="99" r="9" fill="#e8dcb6" stroke="none"/><circle cx="574" cy="98" r="4" fill="#304d46" stroke="none"/><circle cx="575" cy="96" r="1.3" fill="#fff" stroke="none"/>
<path d="M559 83q9-5 16 1" fill="none" stroke-width="2.5"/>
<!-- Little cycling cap -->
<path d="M530 78Q531 51 554 49Q576 46 587 74Z" fill="#54735d" stroke-width="3"/>
<path d="M550 52L557 73" fill="none" stroke="#91a185" stroke-width="2"/>
<path d="M529 78Q564 66 596 76L605 82Q565 80 529 84Z" fill="#789579" stroke-width="3"/>

<path id="scarf" d="M532 155Q487 142 466 165L438 154L448 181Q492 166 539 171" fill="#cb704e" stroke-width="2.5"/>
<path d="M529 149Q545 157 568 147L573 160Q550 173 533 163Z" fill="#de855b" stroke-width="3"/>
<!-- Wing resting on the handlebar -->
<path d="M439 203Q462 184 486 205Q512 236 546 229L620 211Q632 210 633 218Q620 234 553 250Q496 269 445 234" fill="#f4f3e7" stroke-width="3"/>
<path d="M464 221Q490 248 528 242M455 229Q483 253 508 250" fill="none" stroke="#b7c3ac" stroke-width="2"/>
</g>
<g stroke="#dba05b" stroke-width="14" fill="none"><path id="near-shin" d="M464 275L426 324L488 390"/><path id="near-foot" d="M480 390h29" stroke-width="11"/></g>
<path id="pedal" d="M477 398h34" stroke="#304d46" stroke-width="6"/>

</svg>
<footer><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speed-label">1.0×</output></label></div><span class="note">TAKE THE SCENIC ROUTE.</span></footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), svgNS='http://www.w3.org/2000/svg';
// Each wheel has its own spoke group, keeping the tires steady while spokes rotate.
const wheels=[];
for(const x of [325,669]){const g=document.createElementNS(svgNS,'g');g.setAttribute('transform',`translate(${x} 390)`);const spokes=document.querySelector('#wheel .spokes').cloneNode(true);g.append(spokes);$('cycle').insertBefore(g,$('cycle').children[2]);wheels.push(spokes)}
document.querySelector('#wheel .spokes').setAttribute('visibility','hidden');
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches, speed=1, phase=0, last=0;
function button(){ $('toggle').textContent=running?'暂停骑行':'继续骑行';$('toggle').setAttribute('aria-pressed',String(!running)) }
button();$('toggle').onclick=()=>{running=!running;button()};$('speed').oninput=e=>{speed=Number(e.target.value);$('speed-label').value=speed.toFixed(1)+'×'};
function leg(prefix,angle,hipX){const x=462+29*Math.cos(angle),y=390+29*Math.sin(angle),hx=hipX,hy=276,dx=x-hx,dy=y-hy,d=Math.hypot(dx,dy),half=d/2,bend=Math.sqrt(Math.max(0,78*78-half*half)),kx=(hx+x)/2-dy/d*bend,ky=(hy+y)/2+dx/d*bend;$(prefix+'-shin').setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${x} ${y-5}`);$(prefix+'-foot').setAttribute('d',`M${x-7} ${y-4}L${x+17} ${y-4}`);if(prefix==='near')$('pedal').setAttribute('d',`M${x-13} ${y+3}h34`)}
function draw(){const deg=phase*180/Math.PI;wheels.forEach(w=>w.setAttribute('transform',`rotate(${deg*1.6})`));$('crank').setAttribute('transform',`translate(462 390) rotate(${deg})`);leg('far',phase+Math.PI,445);leg('near',phase,464);$('bird').setAttribute('transform',`translate(0 ${Math.sin(phase*2)*2})`);$('scarf').setAttribute('transform',`rotate(${Math.sin(phase*2)*3} 539 160)`);$('road').setAttribute('transform',`translate(${-((phase*65)%440)} 0)`);$('boat').setAttribute('transform',`translate(845 ${265+Math.sin(phase*.5)*2})`)}
function tick(now){if(last&&running)phase+=Math.min((now-last)/1000,.05)*3.3*speed;last=now;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
})();
</script></body></html>
