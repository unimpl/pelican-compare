<script>
const get = id => document.getElementById(id);
const wheels = document.querySelectorAll('.spin');
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let running = !motion.matches, elapsed = 0, last = null, frame;
function draw() {
  const angle = elapsed * .0036 + .35;
  const bob = 1.8 * Math.sin(2 * angle);
  get('bird').setAttribute('transform', 'translate(0 ' + bob + ')');
  get('scarf').setAttribute('transform', 'rotate(' + (2 * Math.sin(angle)) + ' 475 228)');
  wheels.forEach(wheel => wheel.setAttribute('transform', 'rotate(' + elapsed * .32 + ')'));
  get('road').setAttribute('transform', 'translate(' + (-(elapsed * .414) % 140) + ' 0)');
  const dx = 26 * Math.cos(angle), dy = 26 * Math.sin(angle);
  get('crank').setAttribute('d', 'M' + (480-dx) + ' ' + (471-dy) + 'L' + (480+dx) + ' ' + (471+dy));
  for (const side of [-1, 1]) {
    const near = side === 1;
    const x = 480 + side * dx, y = 471 + side * dy;
    const kneeX = (near ? 440 : 464) + side * dy * .58;
    const kneeY = 382 + side * dy * .48;
    const leg = 'M' + (near ? 449 : 468) + ' ' + (319 + bob) + ' Q' + (kneeX+3) + ' ' + (kneeY-10) + ' ' + kneeX + ' ' + kneeY + ' L' + (x-8) + ' ' + (y-9);
    get(near ? 'nearLeg' : 'farLeg').setAttribute('d', leg);
    if (near) get('nearOutline').setAttribute('d', leg);
    get(near ? 'nearFoot' : 'farFoot').setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  }
}
function tick(time) {
  if (last !== null) elapsed += Math.min(time - last, 60);
  last = time;
  draw();
  frame = requestAnimationFrame(tick);
}
function setRunning(value) {
  running = value;
  cancelAnimationFrame(frame);
  last = null;
  get('toggle').querySelector('span').textContent = running ? '暂停' : '播放';
  get('toggle').setAttribute('aria-label', running ? '暂停骑行动画' : '播放骑行动画');
  get('icon').setAttribute('d', running ? 'M2 1h3v12H2zM8 1h3v12H8z' : 'M2 1l10 6-10 6z');
  if (running) frame = requestAnimationFrame(tick);
}
get('toggle').addEventListener('click', () => setRunning(!running));
motion.addEventListener('change', () => setRunning(!motion.matches));
draw();
setRunning(running);
</script>
