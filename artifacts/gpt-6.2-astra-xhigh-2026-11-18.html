</svg>
<button id="motion" type="button" aria-label="暂停动画" title="暂停动画" hidden>
  <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="symbol" d="M5 3h3.5v14H5zm6.5 0H15v14h-3.5z"/></svg>
</button>
</figure>
</main>
<script>
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const control = byId('motion');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches;
  let elapsed = 0;
  let previous;
  let frame;

  function fitScene() {
    const bounds = scene.getBoundingClientRect();
    const ratio = bounds.width / Math.max(bounds.height, 1);
    const width = Math.max(624, Math.min(1640, 800 * ratio));
    const height = Math.max(650, width / ratio);
    scene.setAttribute('viewBox', [588 - width / 2, 397 - height / 2, width, height].join(' '));
    scene.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const scale = Math.min(1, width / 1200);
    const extraSky = Math.max(0, (height - 800) / 2);
    const fitCoast = 'translate(588 ' + (800 + extraSky * .83) + ') scale(' + scale + ') translate(-588 -800)';
    byId('dunes').setAttribute('transform', fitCoast);
    byId('headland').setAttribute('transform', 'translate(' + Math.min(0, (width - 1200) * .38) + ' 0)');
    const fitClouds = 'translate(588 ' + (-extraSky * .55) + ') scale(' + scale + ') translate(-588 0)';
    for (const id of ['clouds', 'cloud-shadows', 'seabirds']) byId(id).setAttribute('transform', fitClouds);
  }

  const legs = ['far', 'near'].map((side, index) => ({
    hipX: index ? 486 : 508,
    hipY: index ? 423 : 419,
    phase: index ? 0 : Math.PI,
    shape: byId(side + '-shape'),
    color: byId(side + '-color'),
    crank: byId(side + '-crank'),
    pedal: byId(side + '-pedal')
  }));
  const wheels = [byId('front-wheel'), byId('back-wheel')];
  const bird = byId('bird');
  const road = byId('road');
  const crankShine = byId('near-crank-shine');

  function draw(seconds) {
    const angle = seconds * Math.PI + .28;
    const bob = 1.5 * Math.sin(angle * 2);
    bird.setAttribute('transform', 'translate(0 ' + bob + ')');
    for (const leg of legs) {
      const phase = angle + leg.phase;
      const x = 549 + 31 * Math.cos(phase);
      const y = 582 + 31 * Math.sin(phase);
      const ankleX = x - 10;
      const ankleY = y - 8;
      const hipY = leg.hipY + bob;
      const dx = ankleX - leg.hipX;
      const dy = ankleY - hipY;
      const length = Math.hypot(dx, dy);
      // 两段固定长度的腿在跗关节处向后折，脚踝始终跟随踏板。
      const bend = Math.sqrt(Math.max(0, 108 * 108 - length * length / 4));
      const hockX = (leg.hipX + ankleX) / 2 - dy / length * bend;
      const hockY = (hipY + ankleY) / 2 + dx / length * bend;
      const limb = 'M' + leg.hipX + ' ' + hipY + 'L' + hockX + ' ' + hockY + 'L' + ankleX + ' ' + ankleY;
      const arm = 'M549 582L' + x + ' ' + y;
      leg.shape.setAttribute('d', limb);
      leg.color.setAttribute('d', limb);
      leg.crank.setAttribute('d', arm);
      leg.pedal.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
      if (leg.phase === 0) crankShine.setAttribute('d', arm);
    }
    const rotation = 'rotate(' + (seconds * 180 % 360) + ')';
    for (const wheel of wheels) wheel.setAttribute('transform', rotation);
    road.setAttribute('transform', 'translate(' + (-(seconds * 276.46 % 276.46)) + ' 0)');
  }

  function tick(now) {
    if (previous !== undefined) elapsed += (now - previous) / 1000;
    previous = now;
    draw(elapsed);
    frame = requestAnimationFrame(tick);
  }

  function syncMotion() {
    cancelAnimationFrame(frame);
    previous = undefined;
    const label = playing ? '暂停动画' : '播放动画';
    control.setAttribute('aria-label', label);
    control.title = label;
    byId('symbol').setAttribute('d', playing ? 'M5 3h3.5v14H5zm6.5 0H15v14h-3.5z' : 'M5 2.5L17 10 5 17.5Z');
    if (playing && !document.hidden) frame = requestAnimationFrame(tick);
  }

  control.addEventListener('click', () => { playing = !playing; syncMotion(); });
  reducedMotion.addEventListener('change', event => { playing = !event.matches; syncMotion(); });
  document.addEventListener('visibilitychange', syncMotion);
  window.addEventListener('resize', fitScene);
  fitScene();
  draw(0);
  control.hidden = false;
  syncMotion();
</script>
