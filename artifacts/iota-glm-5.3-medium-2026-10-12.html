<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · HTML + SVG</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 880px;
    background: #fff;
    border-radius: 20px;
    padding: 18px 18px 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  h1 { text-align: center; color: #28323c; font-size: 26px; margin: 4px 0 2px; }
  .sub { text-align: center; color: #7b8794; font-size: 13px; margin: 0 0 12px; }
  svg { width: 100%; height: auto; display: block; border-radius: 12px; }
  footer { color: #9fb3c8; font-size: 12px; margin-top: 14px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<div class="card">
  <h1>🚲 鹈鹕骑自行车</h1>
  <p class="sub">纯 HTML + SVG（SMIL 动画）· 无 JavaScript · 打开即播放</p>

  <svg viewBox="0 0 800 520" role="img" aria-label="一只白色鹈鹕蹬着红色自行车，在路上欢快地行驶">
    <title>鹈鹕骑自行车</title>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c9e7ff"/>
        <stop offset="1" stop-color="#eef9ff"/>
      </linearGradient>

      <!-- 近侧腿：两段式 IK 关键帧（髋 → 膝 → 踝），与曲柄同周期 -->
      <path id="legNear" fill="none" stroke-linecap="round" stroke-linejoin="round"
            d="M 335 272 L 421.3 303.8 L 390 386">
        <animate attributeName="d" dur="1.5s" repeatCount="indefinite" values="
          M 335 272 L 421.3 303.8 L 390 386;
          M 335 272 L 412 322.4 L 384.6 406;
          M 335 272 L 399.4 337.7 L 370 420.6;
          M 335 272 L 388.5 346.9 L 350 426;
          M 335 272 L 383.1 350.4 L 330 420.6;
          M 335 272 L 383.4 350.2 L 315.4 406;
          M 335 272 L 388.7 346.7 L 310 386;
          M 335 272 L 398.9 338.2 L 315.4 366;
          M 335 272 L 412.7 321.3 L 330 351.4;
          M 335 272 L 423.4 297.5 L 350 346;
          M 335 272 L 426.3 283.7 L 370 351.4;
          M 335 272 L 425.6 288.1 L 384.6 366;
          M 335 272 L 421.3 303.8 L 390 386"/>
      </path>

      <!-- 远侧腿：相位相差 180° -->
      <path id="legFar" fill="none" stroke-linecap="round" stroke-linejoin="round"
            d="M 322 268 L 383 336.9 L 310 386">
        <animate attributeName="d" dur="1.5s" repeatCount="indefinite" values="
          M 322 268 L 383 336.9 L 310 386;
          M 322 268 L 393.6 325.8 L 315.4 366;
          M 322 268 L 405.6 306.4 L 330 351.4;
          M 322 268 L 412.6 284.1 L 350 346;
          M 322 268 L 413.7 275 L 370 351.4;
          M 322 268 L 412.8 282.6 L 384.6 366;
          M 322 268 L 408.3 299.9 L 390 386;
          M 322 268 L 398.5 319.1 L 384.6 406;
          M 322 268 L 386 334.1 L 370 420.6;
          M 322 268 L 376.5 342.1 L 350 426;
          M 322 268 L 373.6 344.2 L 330 420.6;
          M 322 268 L 376.2 342.4 L 315.4 406;
          M 322 268 L 383 336.9 L 310 386"/>
      </path>
    </defs>

    <!-- ======== 背景天空 ======== -->
    <rect x="0" y="0" width="800" height="460" fill="url(#sky)"/>
    <circle cx="695" cy="80" r="52" fill="#ffe08a" opacity="0.45"/>
    <circle cx="695" cy="80" r="36" fill="#ffd257"/>

    <!-- 云（视差漂移） -->
    <g transform="translate(680 72)">
      <g fill="#ffffff" opacity="0.92">
        <animateTransform attributeName="transform" type="translate" values="0 0; -1050 0" dur="26s" begin="-6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="46" ry="17"/>
        <ellipse cx="32" cy="5" rx="32" ry="13"/>
        <ellipse cx="-30" cy="6" rx="28" ry="11"/>
        <ellipse cx="4" cy="-11" rx="26" ry="13"/>
      </g>
    </g>
    <g transform="translate(860 140) scale(0.7)">
      <g fill="#ffffff" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0 0; -1500 0" dur="34s" begin="-20s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="46" ry="17"/>
        <ellipse cx="32" cy="5" rx="32" ry="13"/>
        <ellipse cx="-30" cy="6" rx="28" ry="11"/>
        <ellipse cx="4" cy="-11" rx="26" ry="13"/>
      </g>
    </g>

    <!-- 远处的小鸟 -->
    <g stroke="#5a6b7a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0; -1150 0" dur="20s" begin="-7s" repeatCount="indefinite"/>
      <path d="M 940 112 q 7 -8 14 0 q 7 -8 14 0"/>
      <path d="M 990 96 q 6 -7 12 0 q 6 -7 12 0"/>
    </g>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.65">
      <line x1="20" y1="168" x2="112" y2="168" stroke-dasharray="24 34">
        <animate attributeName="stroke-dashoffset" values="0;58" dur="0.42s" repeatCount="indefinite"/>
      </line>
      <line x1="44" y1="224" x2="150" y2="224" stroke-dasharray="24 34">
        <animate attributeName="stroke-dashoffset" values="0;58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="16" y1="286" x2="104" y2="286" stroke-dasharray="20 30">
        <animate attributeName="stroke-dashoffset" values="0;50" dur="0.38s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- ======== 地面 ======== -->
    <path d="M -30 442 Q 180 356 380 442 Z" fill="#b7e0a0"/>
    <path d="M 220 442 Q 470 372 720 442 Z" fill="#a5d894"/>
    <rect x="0" y="438" width="800" height="19" fill="#8fce77"/>

    <!-- 路边草丛（循环左移，间隔 350 无缝衔接） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -350 0" dur="1s" repeatCount="indefinite"/>
      <g transform="translate(100 455)">
        <path d="M -8 0 Q -6 -12 -2 -3 Q 0 -14 3 -3 Q 6 -11 8 0 Z" fill="#5f9e4a"/>
        <circle cx="0" cy="-13" r="2.6" fill="#e8788a"/>
      </g>
      <g transform="translate(450 455)">
        <path d="M -8 0 Q -6 -12 -2 -3 Q 0 -14 3 -3 Q 6 -11 8 0 Z" fill="#5f9e4a"/>
        <circle cx="0" cy="-13" r="2.6" fill="#e8788a"/>
      </g>
      <g transform="translate(800 455)">
        <path d="M -8 0 Q -6 -12 -2 -3 Q 0 -14 3 -3 Q 6 -11 8 0 Z" fill="#5f9e4a"/>
        <circle cx="0" cy="-13" r="2.6" fill="#e8788a"/>
      </g>
      <g transform="translate(1150 455)">
        <path d="M -8 0 Q -6 -12 -2 -3 Q 0 -14 3 -3 Q 6 -11 8 0 Z" fill="#5f9e4a"/>
        <circle cx="0" cy="-13" r="2.6" fill="#e8788a"/>
      </g>
    </g>

    <!-- 马路 -->
    <rect x="0" y="457" width="800" height="7" fill="#9a9aa4"/>
    <rect x="0" y="464" width="800" height="56" fill="#6d6d78"/>
    <line x1="-10" y1="492" x2="810" y2="492" stroke="#f1c40f" stroke-width="5.5" stroke-dasharray="46 34">
      <animate attributeName="stroke-dashoffset" values="0;80" dur="0.22s" repeatCount="indefinite"/>
    </line>

    <!-- 车轮投影 -->
    <ellipse cx="235" cy="462" rx="66" ry="7" fill="#2c3e50" opacity="0.18"/>
    <ellipse cx="545" cy="462" rx="66" ry="7" fill="#2c3e50" opacity="0.18"/>

    <!-- ======== 车轮 ======== -->
    <g>
      <circle cx="235" cy="395" r="62" fill="none" stroke="#33383d" stroke-width="11"/>
      <circle cx="235" cy="395" r="54" fill="none" stroke="#d8d8dc" stroke-width="3.5"/>
      <g stroke="#c3c8cd" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 235 395" to="360 235 395" dur="1.07s" repeatCount="indefinite"/>
        <line x1="182" y1="395" x2="288" y2="395"/>
        <line x1="235" y1="342" x2="235" y2="448"/>
        <line x1="197.5" y1="357.5" x2="272.5" y2="432.5"/>
        <line x1="197.5" y1="432.5" x2="272.5" y2="357.5"/>
      </g>
      <circle cx="235" cy="395" r="7" fill="#565c63"/>
    </g>
    <g>
      <circle cx="545" cy="395" r="62" fill="none" stroke="#33383d" stroke-width="11"/>
      <circle cx="545" cy="395" r="54" fill="none" stroke="#d8d8dc" stroke-width="3.5"/>
      <g stroke="#c3c8cd" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 545 395" to="360 545 395" dur="1.07s" repeatCount="indefinite"/>
        <line x1="492" y1="395" x2="598" y2="395"/>
        <line x1="545" y1="342" x2="545" y2="448"/>
        <line x1="507.5" y1="357.5" x2="582.5" y2="432.5"/>
        <line x1="507.5" y1="432.5" x2="582.5" y2="357.5"/>
      </g>
      <circle cx="545" cy="395" r="7" fill="#565c63"/>
    </g>

    <!-- ======== 远侧：腿 + 曲柄 + 脚踏 ======== -->
    <use href="#legFar" stroke="#2f2a26" stroke-width="16.5"/>
    <use href="#legFar" stroke="#cf8531" stroke-width="11"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 350 386" to="540 350 386" dur="1.5s" repeatCount="indefinite"/>
      <line x1="350" y1="386" x2="312" y2="386" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="-180 310 386" to="-540 310 386" dur="1.5s" repeatCount="indefinite"/>
        <rect x="294" y="383" width="32" height="7.5" rx="3" fill="#383838"/>
        <path d="M 305 378 L 341 381 L 327 391 L 311 388 Z" fill="#cf8531" stroke="#241f1c" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 小红旗（车尾） -->
    <line x1="262" y1="360" x2="224" y2="296" stroke="#8a8f98" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 224 296 L 188 304 L 224 315 Z" fill="#e74c3c" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" values="0 224 296; -7 224 296; 0 224 296; 5 224 296; 0 224 296" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- ======== 车架 ======== -->
    <g stroke="#d94f4f" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M 350 386 L 331 272"/>          <!-- 座管 -->
      <path d="M 331 272 L 506 288"/>          <!-- 上管 -->
      <path d="M 350 386 L 517 330"/>          <!-- 下管 -->
      <path d="M 350 386 L 235 395"/>          <!-- 后下叉 -->
      <path d="M 331 272 L 235 395"/>          <!-- 后上叉 -->
      <path d="M 517 330 Q 523 368 545 395" stroke="#c74340" stroke-width="8"/> <!-- 前叉 -->
    </g>
    <line x1="506" y1="288" x2="517" y2="330" stroke="#c74340" stroke-width="12" stroke-linecap="round"/>

    <!-- 链条与牙盘 -->
    <circle cx="235" cy="395" r="8" fill="none" stroke="#3f3f3f" stroke-width="4"/>
    <path d="M 235 387 L 350 370" stroke="#4a4a4a" stroke-width="4.5" stroke-dasharray="7 4">
      <animate attributeName="stroke-dashoffset" values="11;0" dur="0.16s" repeatCount="indefinite"/>
    </path>
    <path d="M 235 403 L 350 403" stroke="#4a4a4a" stroke-width="4.5" stroke-dasharray="7 4">
      <animate attributeName="stroke-dashoffset" values="0;11" dur="0.16s" repeatCount="indefinite"/>
    </path>
    <circle cx="350" cy="386" r="16" fill="none" stroke="#3f3f3f" stroke-width="5"/>

    <!-- 车座 -->
    <rect x="298" y="266" width="74" height="10" rx="5" fill="#7c4a26" stroke="#2f2a26" stroke-width="3"/>
    <line x1="308" y1="269" x2="352" y2="269" stroke="#a06a3a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 车把 -->
    <path d="M 506 288 L 497 266 L 476 272" fill="none" stroke="#33383d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="477" cy="272" r="4.5" fill="#2f2a26"/>
    <circle cx="489" cy="255" r="5" fill="#f4c542" stroke="#b8860b" stroke-width="2"/>

    <!-- ======== 近侧：曲柄 + 脚踏 + 腿 ======== -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 350 386" to="360 350 386" dur="1.5s" repeatCount="indefinite"/>
      <line x1="350" y1="386" x2="388" y2="386" stroke="#515151" stroke-width="8" stroke-linecap="round"/>
      <circle cx="350" cy="386" r="5.5" fill="#2f2a26"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 390 386" to="-360 390 386" dur="1.5s" repeatCount="indefinite"/>
        <rect x="374" y="383" width="32" height="7.5" rx="3" fill="#4a4a4a"/>
        <path d="M 385 377 L 421 380 L 407 391 L 391 387 Z" fill="#f5a742" stroke="#2f2a26" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </g>
    <use href="#legNear" stroke="#2f2a26" stroke-width="19"/>
    <use href="#legNear" stroke="#f5a742" stroke-width="13"/>

    <!-- ======== 鹈鹕（随蹬踏轻微起伏） ======== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 3.5; 0 0" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="0.75s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M 264 200 L 222 186 L 246 204 L 208 212 L 242 222 L 226 242 L 266 236 Z"
            fill="#f8f4ec" stroke="#2f2a26" stroke-width="4" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="332" cy="222" rx="82" ry="54" transform="rotate(-10 332 222)"
               fill="#f8f4ec" stroke="#2f2a26" stroke-width="4"/>
      <ellipse cx="336" cy="246" rx="58" ry="22" transform="rotate(-10 336 246)" fill="#ece3d2"/>

      <!-- 脖子（S 曲线，双描边做出轮廓） -->
      <path d="M 370 208 C 398 180 416 172 430 148 C 438 134 441 120 445 106"
            fill="none" stroke="#2f2a26" stroke-width="30" stroke-linecap="round"/>
      <path d="M 370 208 C 398 180 416 172 430 148 C 438 134 441 120 445 106"
            fill="none" stroke="#f8f4ec" stroke-width="22" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="452" cy="102" r="28" fill="#f8f4ec" stroke="#2f2a26" stroke-width="4"/>

      <!-- 喉囊（微微晃动） -->
      <path d="M 466 114 C 470 158 528 168 598 131 L 598 128 L 466 112 Z"
            fill="#ef8f2d" stroke="#2f2a26" stroke-width="3.5" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" values="0 466 114; 2 466 114; 0 466 114" dur="0.75s" repeatCount="indefinite"/>
      </path>

      <!-- 上喙 -->
      <path d="M 466 88 L 600 124 Q 606 130 599 134 L 465 116 Q 456 102 466 88 Z"
            fill="#f6a83c" stroke="#2f2a26" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 484 98 L 522 107" stroke="#c77f1d" stroke-width="3" stroke-linecap="round"/>

      <!-- 眼睛（会眨） -->
      <ellipse cx="459" cy="92" rx="5.2" ry="6" fill="#2f2a26">
        <animate attributeName="ry" values="6;6;0.6;6" keyTimes="0;0.86;0.92;1" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="461" cy="89.5" r="1.7" fill="#ffffff"/>

      <!-- 翅膀：搭在车把上 -->
      <path d="M 346 196 C 396 188 446 212 477 253 C 483 262 479 271 470 271 C 434 249 392 233 348 228 C 335 219 334 203 346 196 Z"
            fill="#f3ede1" stroke="#2f2a26" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 386 216 C 416 224 448 240 468 262" fill="none" stroke="#d9d0be" stroke-width="3" stroke-linecap="round"/>
      <path d="M 376 226 C 404 234 434 248 456 268" fill="none" stroke="#d9d0be" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<footer>
  动画说明：腿部蹬踏采用两段式反向运动学（IK）逐帧计算 · 曲柄/脚踏/车轮/链条由 SMIL 驱动<br>
  脚踏通过「公转 + 反向自转」保持水平 · 背景、车道线、草丛以不同速度左移形成视差
</footer>

</body>
</html>
